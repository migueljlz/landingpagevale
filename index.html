      margin-top: calc(var(--avatar) / -2);

    .avatar {

      width: var(--avatar);
      height: var(--avatar);
      border: 6px solid #fff;
      border-radius: 50%;
      background: #fff;
      object-fit: cover;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .10);

    h1 {

      flex-wrap: wrap;
      align-items: center;

      line-height: 1.2;

      font-size: clamp(.875rem, 3.4vw, 1.0625rem);
      letter-spacing: .01em;
    }

    .tagline span { color: var(--muted); }

    .links {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-top: 36px;
      padding: 0 8px;
      list-style: none;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 76px;
      padding: 10px 22px 10px 14px;
      border: 3px solid var(--line);
      border-radius: 40px;
      background: var(--card);
      color: var(--text);
      font-size: 1.0625rem;
      text-decoration: none;
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }

    .link--primary {
      border-color: var(--blue);
      font-weight: 700;
      box-shadow: 0 6px 22px var(--blue-soft);
    }

    .link:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(0, 0, 0, .08); }
    .link--primary:hover { box-shadow: 0 10px 28px rgba(0, 174, 239, .28); }
    .link:active { transform: translateY(0) scale(.99); }
    .link:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

    .link__icon { flex: none; width: 48px; height: 48px; }
    .link__label { flex: 1; min-width: 0; }
    .link__chevron { flex: none; width: 22px; height: 22px; color: var(--text); }

    @media (prefers-reduced-motion: reduce) {
      .link { transition: none; }
      .link:hover, .link:active { transform: none; }
    }
