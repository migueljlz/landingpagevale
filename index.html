  <style>
    :root {
      --gold: #e8b54a;
      --gold-soft: rgba(232, 181, 74, .35);
      --blue-glow: rgba(40, 120, 255, .35);
      --verified: #2fa8f0;
      --page: #8f97a3;
      --ink: #ffffff;
      --muted: rgba(255, 255, 255, .72);
      --glass: rgba(10, 14, 24, .38);
      --glass-line: rgba(255, 255, 255, .22);
      --avatar: clamp(132px, 34vw, 180px);
      --frame-gap: clamp(0px, 1.6vw, 14px);
    }

    * { box-sizing: border-box; margin: 0; }

    html, body { height: 100%; }

    body {
      min-height: 100dvh;
      background: var(--page);
      color: var(--ink);
      font-family: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Marco redondeado con el fondo, como la referencia */
    .frame {
      position: relative;
      min-height: calc(100dvh - var(--frame-gap) * 2);
      margin: var(--frame-gap);
      overflow: hidden;
      border-radius: clamp(0px, 2.4vw, 22px);
      isolation: isolate;
      display: flex;
      flex-direction: column;
    }

    .frame::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, .55) 0%, rgba(0, 0, 0, .10) 22%, rgba(0, 0, 0, .10) 60%, rgba(0, 0, 0, .65) 100%);
    }

    /* Barra superior */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: clamp(14px, 3vw, 26px) clamp(14px, 4vw, 36px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      color: var(--ink);
      font-weight: 700;
      font-size: clamp(.9375rem, 2.4vw, 1.0625rem);
      letter-spacing: -.01em;
      text-decoration: none;
    }

    .brand img {
      flex: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--gold);
    }

    .brand span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .pills { display: flex; gap: 8px; list-style: none; padding: 0; flex: none; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border: 1px solid var(--glass-line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .12);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      color: var(--ink);
      font-size: .8125rem;
      font-weight: 500;
      text-decoration: none;
      transition: background .16s ease, transform .16s ease;
    }

    .pill:hover { background: rgba(255, 255, 255, .22); }

    .pill--solid {
      background: #fff;
      border-color: #fff;
      color: #0a0a0a;
      font-weight: 600;
    }

    .pill--solid:hover { background: #f1f1f1; }

    .pill svg { width: 16px; height: 16px; flex: none; }

    /* Contenido central */
    .hero {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px clamp(14px, 4vw, 36px) calc(32px + env(safe-area-inset-bottom));
    }

    .card {
      width: 100%;
      max-width: 460px;
      padding: 30px clamp(18px, 5vw, 34px) 28px;
      border: 1px solid var(--glass-line);
      border-radius: 28px;
      background: var(--glass);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      backdrop-filter: blur(14px) saturate(1.2);
      box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
      text-align: center;
    }

    .avatar {
      display: block;
      width: var(--avatar);
      height: var(--avatar);
      margin: 0 auto;
      border: 4px solid var(--gold);
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 0 6px rgba(255, 255, 255, .08), 0 0 34px var(--gold-soft), 0 0 60px var(--blue-glow);
    }

    h1 {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
      font-size: clamp(1.5rem, 6vw, 2rem);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -.02em;
    }

    .badge { flex: none; width: .85em; height: .85em; }

    .tagline {
      margin-top: 8px;
      color: var(--gold);
      font-size: clamp(.75rem, 3vw, .875rem);
      font-weight: 500;
      letter-spacing: .14em;
    }

    .tagline span { color: var(--muted); }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 28px;
      padding: 0;
      list-style: none;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 64px;
      padding: 8px 20px 8px 10px;
      border: 1px solid var(--glass-line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .10);
      color: var(--ink);
      font-size: 1rem;
      font-weight: 500;
      text-align: left;
      text-decoration: none;
      transition: transform .16s ease, background .16s ease, box-shadow .16s ease;
    }

    .link--primary {
      border-color: #fff;
      background: #fff;
      color: #0a0a0a;
      font-weight: 700;
      box-shadow: 0 8px 28px rgba(255, 255, 255, .18);
    }

    .link:hover { transform: translateY(-2px); background: rgba(255, 255, 255, .18); }
    .link--primary:hover { background: #fff; box-shadow: 0 12px 34px var(--gold-soft); }
    .link:active { transform: translateY(0) scale(.99); }
    .link:focus-visible, .pill:focus-visible, .brand:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

    .link__icon { flex: none; width: 44px; height: 44px; }
    .link__label { flex: 1; min-width: 0; }
    .link__chevron { flex: none; width: 20px; height: 20px; }

    @media (max-width: 420px) {
      .pill { padding: 7px 11px; font-size: .75rem; }
      .pill__text { display: none; }
      .pill svg { width: 18px; height: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .link, .pill { transition: none; }
      .link:hover, .link:active { transform: none; }
    }
  </style>
</head>
